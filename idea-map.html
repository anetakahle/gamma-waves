<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Galaxy – Personal Mind Map</title>
<style>
    body { margin: 0; overflow: hidden; background: #070015; font-family: monospace; }
    .project-label {
        position: absolute;
        color: #c8a8ff;
        font-size: 14px;
        pointer-events: none;
        background: rgba(7,0,21,0.88);
        padding: 2px 8px;
        border-radius: 4px;
        display: none;
        z-index: 10;
        max-width: 400px;
        white-space: pre-line;
        text-align: center;
        transition: opacity 0.2s;
    }
    #description-popup {
        position: absolute;
        left: 50%;
        top: 60px;
        transform: translateX(-50%);
        min-width: 300px;
        max-width: 600px;
        background: rgba(10,5,30,0.98);
        color: #e8c8ff;
        border: 2px solid #9955dd;
        border-radius: 8px;
        padding: 16px 18px;
        font-size: 16px;
        font-family: monospace;
        z-index: 20;
        box-shadow: 0 4px 24px #000;
        display: none;
        white-space: pre-line;
        text-align: left;
    }
    #legend {
        position: absolute;
        left: 14px;
        top: 12px;
        background: rgba(7,0,21,0.88);
        color: #c8a8ff;
        border-radius: 7px;
        padding: 10px 16px;
        font-size: 14px;
        font-family: monospace;
        z-index: 30;
        max-width: 320px;
        line-height: 1.7;
        border: 1px solid #7733cc;
        box-shadow: 0 2px 12px #000;
        letter-spacing: 0.02em;
        transition: opacity 0.2s;
    }
    .amber-highlight {
        pointer-events: none;
        position: absolute;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: 3px solid #c8a8ff;
        box-shadow: 0 0 18px #c8a8ff80;
        background: none;
        z-index: 15;
        display: none;
    }
</style>
</head>
<body>
<div id="legend">
<b>My Galaxy</b><br>
W/A/S/D: Move<br>
Z: Toggle all labels<br>
X: Show/hide description<br>
H/J: Previous<br>
L/;: Next<br>
K: Random<br>
C: Toggle this panel<br>
<small>(Amber circle highlights selected. Try X!)</small>
</div>
<div id="description-popup"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script>
// ==== My Galaxy: central node, five categories, leaf topics ====
// group: 0 = center, 1–5 = category (shared planet color per category)
const CATEGORY_GROUP_COLORS = {
    0: 0xffd700,  // center – warm gold
    1: 0xaa55ff,  // Soul & Consciousness – deep violet
    2: 0xff77aa,  // Love & Connection – warm rose
    3: 0x44cc88,  // Purpose & Creation – emerald
    4: 0x88cc44,  // Body & Nature – forest green
    5: 0x44cccc,  // Healing & Integration – teal
    6: 0xffaa44   // Work & Leadership – warm amber
};

const galaxyTree = [
    {
        title: "✨ Soul & Consciousness",
        desc: "Relating to your own soul, intuition, and expanded states of awareness.",
        items: [
            "What My Soul Needs",
            "Listening to My Inner Voice",
            "Trusting Intuition",
            "Relationship with My Higher Self",
            "States of Consciousness & Expansion",
            "Dreams and Visions",
            "Meditation & Silence",
            "Surrendering to the Flow",
            "Connection with the Spiritual World",
            "The Path of Awakening"
        ]
    },
    {
        title: "💗 Love & Connection",
        desc: "Sharing love freely, deep presence, and heart-to-heart connection with others.",
        items: [
            "Sharing Love Without Conditions",
            "Love Without Fear",
            "Deep Listening",
            "Forgiveness as Liberation",
            "Authentic Meeting with Others",
            "Vulnerability as Strength",
            "Empathy & Compassion",
            "Presence in Relationships",
            "Heart-to-Heart Connection",
            "Community & Belonging",
            "Connecting with People",
            "Creating Friendships",
            "Kindness and Offering Help",
            "True Kindness"
        ]
    },
    {
        title: "🌱 Purpose & Creation",
        desc: "Why I am here, what I create, and how I contribute to the world.",
        items: [
            "Why I Am Here – My Mission",
            "The Art of Solitude and Calm",
            "Leading from Love",
            "Contribution vs. Achievement",
            "Creative Flow",
            "Sharing Gifts and Knowledge",
            "Meaningful Work",
            "Serving Others",
            "Sustainable Creation",
            "Living an Authentic Mission"
        ]
    },
    {
        title: "🌿 Body & Nature",
        desc: "Body wisdom, love of nature, and living in harmony with natural rhythms.",
        items: [
            "Listening to Body Wisdom",
            "Loving Nature",
            "Natural Rhythms and Cycles",
            "Plant Wisdom",
            "Somatic Awareness",
            "Rest & Renewal",
            "Earth Connection",
            "Breath as Medicine",
            "Sensory Presence",
            "Self-Care as Sacred Practice",
            "Exploring the Underwater World",
            "Diving",
            "Korean Beauty",
            "Natural Beauty"
        ]
    },
    {
        title: "🌀 Healing & Integration",
        desc: "Integrating transformative experiences, releasing old patterns, and embracing wholeness.",
        items: [
            "Integrating Insights",
            "Releasing Old Patterns",
            "The Shadow as Teacher",
            "Embracing Wholeness",
            "Working with Fear",
            "From Trauma to Wisdom",
            "Self-Compassion",
            "Grounding After Expansion",
            "Honoring All Parts of Self",
            "The Ongoing Healing Journey"
        ]
    },
    {
        title: "💼 Work & Leadership",
        desc: "Leading, delegating, feedback, and pressure at work.",
        items: [
            "Delegating Effectively",
            "Guiding Underperformers",
            "Fairness vs. Efficiency",
            "Handling Poor Quality Work",
            "Setting Clear Expectations",
            "Giving & Receiving Feedback",
            "Authority vs. Likability",
            "Team Responsibility",
            "Decision Making Under Pressure",
            "Leadership Growth"
        ]
    }
];

function buildProjectData() {
    const nodes = [];
    const links = [];
    let idx = 0;
    const centerIndex = idx;
    nodes.push({
        name: "My Galaxy",
        desc: "Your map after transformation: five new dimensions of being.",
        group: 0,
        kind: "center",
        radius: 48
    });
    idx++;

    galaxyTree.forEach((cat, catNum) => {
        const group = catNum + 1;
        const catIdx = idx;
        nodes.push({
            name: cat.title,
            desc: cat.desc,
            group,
            kind: "category",
            radius: 36
        });
        links.push([centerIndex, catIdx]);
        idx++;

        cat.items.forEach((itemName) => {
            const leafIdx = idx;
            nodes.push({
                name: itemName,
                desc: `A focus area within ${cat.title}.`,
                group,
                kind: "leaf",
                radius: 24
            });
            links.push([catIdx, leafIdx]);
            idx++;
        });
    });

    return { nodes, links };
}

const { nodes: projectData, links: graphLinks } = buildProjectData();

function groupColor(group) {
    return CATEGORY_GROUP_COLORS[group] ?? 0x00ff00;
}

function layoutGalaxy(nodes, links) {
    const center = new THREE.Vector3(0, 0, -2600);
    const categoryRingR = 1900;
    const leafRingR = 520;
    const categoryIndices = [];
    nodes.forEach((n, i) => {
        if (n.kind === "center") {
            n.position = center.clone();
        } else if (n.kind === "category") {
            categoryIndices.push(i);
        }
    });
    categoryIndices.forEach((nodeIndex, c) => {
        const angle = (c / categoryIndices.length) * Math.PI * 2 - Math.PI / 2;
        const n = nodes[nodeIndex];
        n.position = new THREE.Vector3(
            center.x + categoryRingR * Math.cos(angle),
            center.y + categoryRingR * Math.sin(angle),
            center.z + Math.sin(angle * 1.7) * 220
        );
    });
    const leavesByCategory = new Map();
    links.forEach(([a, b]) => {
        const na = nodes[a];
        const nb = nodes[b];
        if (na.kind === "category" && nb.kind === "leaf") {
            if (!leavesByCategory.has(a)) leavesByCategory.set(a, []);
            leavesByCategory.get(a).push(b);
        }
    });
    leavesByCategory.forEach((leafIdxs, catIdx) => {
        const catPos = nodes[catIdx].position;
        const count = leafIdxs.length;
        leafIdxs.forEach((leafIdx, j) => {
            const t = (j / count) * Math.PI * 2;
            const bump = (j * 2.17) % 1;
            const r = leafRingR * (0.82 + 0.18 * bump);
            nodes[leafIdx].position = new THREE.Vector3(
                catPos.x + r * Math.cos(t),
                catPos.y + r * Math.sin(t) * 0.85,
                catPos.z + 140 * Math.sin(t * 1.3)
            );
        });
    });
}

// ==== Scene Setup ====
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 12000);
camera.position.z = 3000;
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Starfield
const starGeometry = new THREE.BufferGeometry();
const starCount = 1000;
const starPositions = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++) {
    starPositions[i*3] = Math.random() * 10000 - 5000;
    starPositions[i*3+1] = Math.random() * 10000 - 5000;
    starPositions[i*3+2] = Math.random() * -10000;
}
starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
const starMaterial = new THREE.PointsMaterial({ color: 0x5533aa, size: 1.5 });
const stars = new THREE.Points(starGeometry, starMaterial);
scene.add(stars);

layoutGalaxy(projectData, graphLinks);

// Hierarchy edges (center ↔ categories ↔ leaves)
const linkVerts = new Float32Array(graphLinks.length * 6);
graphLinks.forEach(([from, to], li) => {
    const a = projectData[from].position;
    const b = projectData[to].position;
    const o = li * 6;
    linkVerts[o] = a.x; linkVerts[o + 1] = a.y; linkVerts[o + 2] = a.z;
    linkVerts[o + 3] = b.x; linkVerts[o + 4] = b.y; linkVerts[o + 5] = b.z;
});
const linkGeometry = new THREE.BufferGeometry();
linkGeometry.setAttribute('position', new THREE.BufferAttribute(linkVerts, 3));
const linkMaterial = new THREE.LineBasicMaterial({
    color: 0x7733cc,
    transparent: true,
    opacity: 0.35
});
const linkLines = new THREE.LineSegments(linkGeometry, linkMaterial);
scene.add(linkLines);

// Planets & Labels
const planets = [];
const labels = [];
projectData.forEach((p, idx) => {
    const r = p.radius != null ? p.radius : 25;
    const geo = new THREE.SphereGeometry(r, 12, 12);
    const mat = new THREE.MeshBasicMaterial({ color: groupColor(p.group) });
    const planet = new THREE.Mesh(geo, mat);
    planet.position.copy(p.position);
    planet.userData = { ...p, index: idx };
    scene.add(planet);
    planets.push(planet);

    const label = document.createElement('div');
    label.className = 'project-label';
    label.innerText = p.name;
    document.body.appendChild(label);
    labels.push(label);
});

// Amber Highlight Circle
const amberCircle = document.createElement('div');
amberCircle.className = 'amber-highlight';
document.body.appendChild(amberCircle);

// State
let labelsVisible = true; // Start ON
let legendVisible = true; // Start ON
let selectedIndex = 0;
let descriptionVisible = false;

// Controls
const keys = {};
document.addEventListener('keydown', e=>{
    keys[e.key.toLowerCase()] = true;
    // Z: toggle labels
    if(e.key.toLowerCase() === 'z') {
        labelsVisible = !labelsVisible;
        labels.forEach(label => {
            label.style.display = labelsVisible ? 'block' : 'none';
        });
        amberCircle.style.display = labelsVisible ? 'block' : 'none';
    }
    // X: toggle description popup
    if(e.key.toLowerCase() === 'x') {
        descriptionVisible = !descriptionVisible;
        updateDescriptionPopup();
    }
    // H/J: previous
    if(e.key.toLowerCase() === 'h' || e.key.toLowerCase() === 'j') {
        selectedIndex = (selectedIndex - 1 + planets.length) % planets.length;
        updateDescriptionPopup();
    }
    // L/;: next
    if(e.key.toLowerCase() === 'l' || e.key === ';') {
        selectedIndex = (selectedIndex + 1) % planets.length;
        updateDescriptionPopup();
    }
    // K: random
    if(e.key.toLowerCase() === 'k') {
        selectedIndex = Math.floor(Math.random() * planets.length);
        updateDescriptionPopup();
    }
    // C: toggle legend panel
    if(e.key.toLowerCase() === 'c') {
        legendVisible = !legendVisible;
        document.getElementById('legend').style.opacity = legendVisible ? "1" : "0";
        document.getElementById('legend').style.pointerEvents = legendVisible ? "auto" : "none";
    }
});
document.addEventListener('keyup', e=>keys[e.key.toLowerCase()]=false);

// Description Popup
const descPopup = document.getElementById('description-popup');
function updateDescriptionPopup() {
    if (!descriptionVisible) {
        descPopup.style.display = "none";
    } else {
        const p = projectData[selectedIndex];
        descPopup.textContent = p.desc ? `${p.name}\n\n${p.desc}` : p.name;
        descPopup.style.display = "block";
    }
}

// Animate
function animate(){
    requestAnimationFrame(animate);

    // Slowly rotate starfield
    stars.rotation.y += 0.00008;
    stars.rotation.x += 0.00004;

    // Camera controls
    if(keys['w']) camera.position.z -= 30;
    if(keys['s']) camera.position.z += 30;
    if(keys['a']) camera.position.x -= 30;
    if(keys['d']) camera.position.x += 30;
    camera.updateProjectionMatrix();

    // Position labels overhead
    if(labelsVisible) {
        planets.forEach((planet, i) => {
            const r = planet.geometry.parameters.radius;
            const worldPos = planet.position.clone();
            worldPos.y += r + 12;
            const screenPos = worldPos.project(camera);
            const x = (screenPos.x * 0.5 + 0.5) * window.innerWidth;
            const y = (-screenPos.y * 0.5 + 0.5) * window.innerHeight;
            labels[i].style.left = `${x - labels[i].offsetWidth/2}px`;
            labels[i].style.top = `${y - labels[i].offsetHeight}px`;
            // Hide if behind camera
            labels[i].style.opacity = (screenPos.z < 1 && screenPos.z > -1) ? '1' : '0';
            labels[i].style.display = 'block';
        });
        // Amber highlight for selected
        const planet = planets[selectedIndex];
        const rSel = planet.geometry.parameters.radius;
        const worldPos = planet.position.clone();
        worldPos.y += rSel + 12;
        const screenPos = worldPos.project(camera);
        amberCircle.style.left = `${(screenPos.x * 0.5 + 0.5) * window.innerWidth - amberCircle.offsetWidth/2}px`;
        amberCircle.style.top = `${(-screenPos.y * 0.5 + 0.5) * window.innerHeight - amberCircle.offsetHeight - 12}px`;
        amberCircle.style.opacity = (screenPos.z < 1 && screenPos.z > -1) ? '1' : '0';
        amberCircle.style.display = 'block';
    } else {
        labels.forEach(label => label.style.display = 'none');
        amberCircle.style.display = 'none';
    }

    renderer.render(scene, camera);
}
animate();

// Resize
window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
