function buildProjectData() {
    const nodes = [];
    const links = [];
    let idx = 0;
    const centerIndex = idx;
    nodes.push({
        name: "My Galaxy",
        desc: "A map of my inner world — mind, heart, body, and the things that make me me.",
        group: 0,
        kind: "center",
        radius: 48
    });
    idx++;

    galaxyTree.forEach((cat, catNum) => {
        const group = catNum + 1;
        const catIdx = idx;
        nodes.push({
            name: cat.title,
            desc: cat.desc,
            group,
            kind: "category",
            radius: 36
        });
        links.push([centerIndex, catIdx]);
        idx++;

        cat.items.forEach((itemName) => {
            const leafIdx = idx;
            nodes.push({
                name: itemName,
                desc: `A focus area within ${cat.title}.`,
                group,
                kind: "leaf",
                radius: 24
            });
            links.push([catIdx, leafIdx]);
            idx++;
        });
    });

    return { nodes, links };
}

const { nodes: projectData, links: graphLinks } = buildProjectData();

function groupColor(group) {
    return CATEGORY_GROUP_COLORS[group] ?? 0x00ff00;
}

// Evenly distribute points on a sphere (golden-angle / Fibonacci sphere) — true 3D spread
function fibonacciSphere(i, n) {
    const offset = 2 / n;
    const increment = Math.PI * (3 - Math.sqrt(5)); // golden angle
    const y = (i * offset - 1) + offset / 2;
    const r = Math.sqrt(Math.max(0, 1 - y * y));
    const phi = i * increment;
    return new THREE.Vector3(Math.cos(phi) * r, y, Math.sin(phi) * r);
}

function layoutGalaxy(nodes, links) {
    const center = new THREE.Vector3(0, 0, -2600);
    const coneLength = 2000;  // length of the pinecone along the priority axis (core → tip)
    const coneWidth = 560;    // max radius from the axis (fatness of the šiška)
    const leafR = 260;        // leaves form a tight 3D cloud around each category
    const golden = Math.PI * (3 - Math.sqrt(5));  // golden angle
    const categoryIndices = [];
    nodes.forEach((n, i) => {
        if (n.kind === "center") {
            n.position = center.clone();
        } else if (n.kind === "category") {
            categoryIndices.push(i);
        }
    });
    // Categories form a pinecone (šiška): a golden-angle spiral wrapping a tapered cone
    // along a tilted priority axis — Soul at the tight core, Mathematics at the far tip.
    const nCat = categoryIndices.length;
    const axis = new THREE.Vector3(0.35, 0.22, -0.91).normalize();
    const u = new THREE.Vector3().crossVectors(axis, new THREE.Vector3(0, 1, 0)).normalize();
    const v = new THREE.Vector3().crossVectors(axis, u).normalize();
    categoryIndices.forEach((nodeIndex, c) => {
        const t = nCat > 1 ? c / (nCat - 1) : 0;       // 0 = core, 1 = far tip
        const phi = c * golden;                         // spiral around the axis
        const taper = Math.sin(Math.PI * t);            // fat in the middle, narrow at the ends
        const rho = coneWidth * (0.3 + 0.7 * taper);    // radius from the axis
        const along = t * coneLength;                   // distance along the axis
        const offset = axis.clone().multiplyScalar(along)
            .add(u.clone().multiplyScalar(rho * Math.cos(phi)))
            .add(v.clone().multiplyScalar(rho * Math.sin(phi)));
        nodes[nodeIndex].position = center.clone().add(offset);
    });
    const leavesByCategory = new Map();
    links.forEach(([a, b]) => {
        const na = nodes[a];
        const nb = nodes[b];
        if (na.kind === "category" && nb.kind === "leaf") {
            if (!leavesByCategory.has(a)) leavesByCategory.set(a, []);
            leavesByCategory.get(a).push(b);
        }
    });
    // Leaves as a 3D spherical cloud around each category
    leavesByCategory.forEach((leafIdxs, catIdx) => {
        const catPos = nodes[catIdx].position;
        const count = leafIdxs.length;
        leafIdxs.forEach((leafIdx, j) => {
            const dir = fibonacciSphere(j, count);
            const bump = (j * 2.17) % 1;
            const r = leafR * (0.7 + 0.5 * bump);
            nodes[leafIdx].position = catPos.clone().add(dir.multiplyScalar(r));
        });
    });
}

// ==== Scene Setup ====
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 12000);
camera.position.z = 3000;
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Mouse controls: drag to rotate, wheel to zoom, right-drag to pan (smooth damping)
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, -2600);          // orbit around the galaxy center
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.rotateSpeed = 0.6;
controls.zoomSpeed = 0.9;
controls.panSpeed = 0.6;
controls.minDistance = 250;
controls.maxDistance = 9000;
camera.position.set(0, 700, 2600);         // initial framing of the cluster
controls.update();

// Starfield
const starGeometry = new THREE.BufferGeometry();
const starCount = 1000;
const starPositions = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++) {
    starPositions[i*3] = Math.random() * 10000 - 5000;
    starPositions[i*3+1] = Math.random() * 10000 - 5000;
    starPositions[i*3+2] = Math.random() * -10000;
}
starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
const starMaterial = new THREE.PointsMaterial({ color: 0x5533aa, size: 1.5 });
const stars = new THREE.Points(starGeometry, starMaterial);
scene.add(stars);

layoutGalaxy(projectData, graphLinks);

// Hierarchy edges (center ↔ categories ↔ leaves)
const linkVerts = new Float32Array(graphLinks.length * 6);
graphLinks.forEach(([from, to], li) => {
    const a = projectData[from].position;
    const b = projectData[to].position;
    const o = li * 6;
    linkVerts[o] = a.x; linkVerts[o + 1] = a.y; linkVerts[o + 2] = a.z;
    linkVerts[o + 3] = b.x; linkVerts[o + 4] = b.y; linkVerts[o + 5] = b.z;
});
const linkGeometry = new THREE.BufferGeometry();
linkGeometry.setAttribute('position', new THREE.BufferAttribute(linkVerts, 3));
const linkMaterial = new THREE.LineBasicMaterial({
    color: 0x7733cc,
    transparent: true,
    opacity: 0.35
});
const linkLines = new THREE.LineSegments(linkGeometry, linkMaterial);
scene.add(linkLines);

// Planets & Labels
const planets = [];
const labels = [];
projectData.forEach((p, idx) => {
    const r = p.radius != null ? p.radius : 25;
    const geo = new THREE.SphereGeometry(r, 12, 12);
    const mat = new THREE.MeshBasicMaterial({ color: groupColor(p.group), transparent: p.kind === 'leaf' });
    const planet = new THREE.Mesh(geo, mat);
    planet.position.copy(p.position);
    planet.userData = { ...p, index: idx };
    scene.add(planet);
    planets.push(planet);

    const label = document.createElement('div');
    label.className = 'project-label';
    label.innerText = p.name;
    document.body.appendChild(label);
    labels.push(label);
});

// LOD: map each leaf index → its parent category's position
const leafParentPos = new Array(projectData.length).fill(null);
graphLinks.forEach(([from, to]) => {
    if (projectData[from].kind === 'category' && projectData[to].kind === 'leaf') {
        leafParentPos[to] = projectData[from].position;
    }
});

// Amber Highlight Circle
const amberCircle = document.createElement('div');
amberCircle.className = 'amber-highlight';
document.body.appendChild(amberCircle);

// State
let labelsVisible = true; // Start ON
let legendVisible = true; // Start ON
let selectedIndex = 0;
let descriptionVisible = false;

// Controls
const keys = {};
document.addEventListener('keydown', e=>{
    keys[e.key.toLowerCase()] = true;
    // Z: toggle labels
    if(e.key.toLowerCase() === 'z') {
        labelsVisible = !labelsVisible;
        labels.forEach(label => {
            label.style.display = labelsVisible ? 'block' : 'none';
        });
        amberCircle.style.display = labelsVisible ? 'block' : 'none';
    }
    // X: toggle description popup
    if(e.key.toLowerCase() === 'x') {
        descriptionVisible = !descriptionVisible;
        updateDescriptionPopup();
    }
    // H/J: previous
    if(e.key.toLowerCase() === 'h' || e.key.toLowerCase() === 'j') {
        selectedIndex = (selectedIndex - 1 + planets.length) % planets.length;
        updateDescriptionPopup();
    }
    // L/;: next
    if(e.key.toLowerCase() === 'l' || e.key === ';') {
        selectedIndex = (selectedIndex + 1) % planets.length;
        updateDescriptionPopup();
    }
    // K: random
    if(e.key.toLowerCase() === 'k') {
        selectedIndex = Math.floor(Math.random() * planets.length);
        updateDescriptionPopup();
    }
    // C: toggle legend panel
    if(e.key.toLowerCase() === 'c') {
        legendVisible = !legendVisible;
        document.getElementById('legend').style.opacity = legendVisible ? "1" : "0";
        document.getElementById('legend').style.pointerEvents = legendVisible ? "auto" : "none";
    }
});
document.addEventListener('keyup', e=>keys[e.key.toLowerCase()]=false);

// Description Popup
const descPopup = document.getElementById('description-popup');
function updateDescriptionPopup() {
    if (!descriptionVisible) {
        descPopup.style.display = "none";
    } else {
        const p = projectData[selectedIndex];
        descPopup.textContent = p.desc ? `${p.name}\n\n${p.desc}` : p.name;
        descPopup.style.display = "block";
    }
}

// Animate
function animate(){
    requestAnimationFrame(animate);

    // Slowly rotate starfield
    stars.rotation.y += 0.00008;
    stars.rotation.x += 0.00004;

    // Mouse orbit / zoom / pan (with damping)
    controls.update();

    // LOD: fade leaf nodes in/out based on distance to parent category
    const LOD_FAR = 2200;
    const LOD_NEAR = 1200;
    projectData.forEach((p, i) => {
        if (p.kind === 'leaf') {
            const parentPos = leafParentPos[i];
            const dist = parentPos ? camera.position.distanceTo(parentPos) : Infinity;
            if (dist > LOD_FAR) {
                planets[i].visible = false;
            } else {
                planets[i].visible = true;
                planets[i].material.opacity = Math.max(0, Math.min(1, (LOD_FAR - dist) / (LOD_FAR - LOD_NEAR)));
            }
        }
    });

    // Position labels overhead
    if(labelsVisible) {
        planets.forEach((planet, i) => {
            const r = planet.geometry.parameters.radius;
            const worldPos = planet.position.clone();
            worldPos.y += r + 12;
            const screenPos = worldPos.project(camera);
            const x = (screenPos.x * 0.5 + 0.5) * window.innerWidth;
            const y = (-screenPos.y * 0.5 + 0.5) * window.innerHeight;
            labels[i].style.left = `${x - labels[i].offsetWidth/2}px`;
            labels[i].style.top = `${y - labels[i].offsetHeight}px`;
            // Hide if behind camera or LOD-hidden
            const lodAlpha = planet.userData.kind === 'leaf' ? (planet.material.opacity ?? 1) : 1;
            labels[i].style.opacity = (screenPos.z < 1 && screenPos.z > -1 && planet.visible)
                ? String(lodAlpha) : '0';
            labels[i].style.display = 'block';
        });
        // Amber highlight for selected
        const planet = planets[selectedIndex];
        const rSel = planet.geometry.parameters.radius;
        const worldPos = planet.position.clone();
        worldPos.y += rSel + 12;
        const screenPos = worldPos.project(camera);
        amberCircle.style.left = `${(screenPos.x * 0.5 + 0.5) * window.innerWidth - amberCircle.offsetWidth/2}px`;
        amberCircle.style.top = `${(-screenPos.y * 0.5 + 0.5) * window.innerHeight - amberCircle.offsetHeight - 12}px`;
        amberCircle.style.opacity = (screenPos.z < 1 && screenPos.z > -1) ? '1' : '0';
        amberCircle.style.display = 'block';
    } else {
        labels.forEach(label => label.style.display = 'none');
        amberCircle.style.display = 'none';
    }

    renderer.render(scene, camera);
}
animate();

// Resize
window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
